services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resource_collections
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resource_collections"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - resource_collections_pg:/var/lib/postgresql/data

volumes:
  resource_collections_pg:
